services:

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: tool32-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-tool32db}
      POSTGRES_USER:     ${DB_USER:-tool32user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tool32pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tool32-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tool32user} -d ${DB_NAME:-tool32db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tool32-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - tool32-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── AI Service ───────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: tool32-ai
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL:   ${GROQ_MODEL:-llama-3.3-70b-versatile}
      PORT:         5001
    ports:
      - "5001:5001"
    networks:
      - tool32-network
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tool32-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST:                postgres
      DB_PORT:                5432
      DB_NAME:                ${DB_NAME:-tool32db}
      DB_USER:                ${DB_USER:-tool32user}
      DB_PASSWORD:            ${DB_PASSWORD:-tool32pass}
      REDIS_HOST:             redis
      REDIS_PORT:             6379
      JWT_SECRET:             ${JWT_SECRET:-mySecretKeyForTool32ProcedureDocumentationToolJWT2026SuperLong}
      JWT_EXPIRATION:         ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      AI_SERVICE_URL:         http://ai-service:5001
      MAIL_HOST:              ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT:              ${MAIL_PORT:-587}
      MAIL_USERNAME:          ${MAIL_USERNAME:-}
      MAIL_PASSWORD:          ${MAIL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - tool32-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tool32-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tool32-network

networks:
  tool32-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
