<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — AuthSystem</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Page-specific: email sent illustration */
    .sent-illustration {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      box-shadow: 0 8px 20px rgba(16,185,129,.35);
      animation: popIn .5s cubic-bezier(.175,.885,.32,1.275) both;
    }
    .sent-illustration i { font-size: 2rem; color: #fff; }

    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .step-indicator {
      display: flex;
      justify-content: center;
      gap: .5rem;
      margin-bottom: 1.75rem;
    }
    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border-color);
      transition: var(--transition);
    }
    .step-dot.active {
      background: var(--primary);
      width: 24px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Step Indicator -->
      <div class="step-indicator">
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
      </div>

      <!-- ===== STEP 1: Enter Email ===== -->
      <div id="stepEmail">
        <div class="brand-logo">
          <i class="bi bi-key-fill"></i>
        </div>
        <h1 class="auth-title">Forgot Password?</h1>
        <p class="auth-subtitle">
          No worries! Enter your email and we'll send you a reset link.
        </p>

        <form id="forgotForm" novalidate>
          <div class="mb-4">
            <label for="forgotEmail" class="form-label">
              <i class="bi bi-envelope me-1"></i>Email Address
            </label>
            <input
              type="email"
              id="forgotEmail"
              class="form-control"
              placeholder="you@example.com"
              required
              autocomplete="email"
            />
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>

          <button type="submit" class="btn-primary-custom mb-3">
            <i class="bi bi-send me-2"></i>Send Reset Link
          </button>

          <div class="auth-divider">remember your password?</div>

          <p class="text-center mb-0" style="font-size:.9rem;">
            <a href="index.html" class="auth-link">
              <i class="bi bi-arrow-left me-1"></i>Back to Sign In
            </a>
          </p>
        </form>
      </div>

      <!-- ===== STEP 2: Email Sent Confirmation ===== -->
      <div id="stepSent" class="d-none text-center">
        <div class="sent-illustration">
          <i class="bi bi-envelope-check-fill"></i>
        </div>
        <h1 class="auth-title">Check Your Email</h1>
        <p class="auth-subtitle">
          We've sent a password reset link to<br />
          <strong id="sentEmailDisplay" style="color:var(--primary);"></strong>
        </p>

        <div
          class="alert alert-custom mb-4"
          style="background:#f0fdf4; color:#166534; border-left:4px solid #10b981;"
        >
          <i class="bi bi-info-circle me-2"></i>
          Didn't receive it? Check your spam folder or try again.
        </div>

        <button
          id="resendBtn"
          class="btn-primary-custom mb-3"
          style="background:linear-gradient(135deg,#10b981,#06b6d4);"
        >
          <i class="bi bi-arrow-clockwise me-2"></i>Resend Email
        </button>

        <p class="text-center mb-0" style="font-size:.9rem;">
          <a href="index.html" class="auth-link">
            <i class="bi bi-arrow-left me-1"></i>Back to Sign In
          </a>
        </p>
      </div>

    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmFXFMrWQ8I5/s5tnFkFZQnXkKp"
    crossorigin="anonymous"
  ></script>

  <script>
    const forgotForm = document.getElementById('forgotForm');
    const stepEmail  = document.getElementById('stepEmail');
    const stepSent   = document.getElementById('stepSent');
    const dots       = document.querySelectorAll('.step-dot');

    forgotForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!forgotForm.checkValidity()) {
        forgotForm.classList.add('was-validated');
        return;
      }

      const email = document.getElementById('forgotEmail').value.trim();
      document.getElementById('sentEmailDisplay').textContent = email;

      /* Animate step transition */
      stepEmail.style.opacity = '0';
      stepEmail.style.transform = 'translateX(-20px)';
      stepEmail.style.transition = 'all .3s ease';

      setTimeout(() => {
        stepEmail.classList.add('d-none');
        stepSent.classList.remove('d-none');
        stepSent.style.opacity = '0';
        stepSent.style.transform = 'translateX(20px)';
        stepSent.style.transition = 'all .3s ease';

        requestAnimationFrame(() => {
          stepSent.style.opacity = '1';
          stepSent.style.transform = 'translateX(0)';
        });

        /* Update step dots */
        dots[0].classList.remove('active');
        dots[1].classList.add('active');
      }, 300);
    });

    /* Resend with countdown */
    const resendBtn = document.getElementById('resendBtn');
    resendBtn.addEventListener('click', () => {
      let count = 30;
      resendBtn.disabled = true;
      resendBtn.innerHTML = `<i class="bi bi-hourglass-split me-2"></i>Resend in ${count}s`;

      const timer = setInterval(() => {
        count--;
        resendBtn.innerHTML = `<i class="bi bi-hourglass-split me-2"></i>Resend in ${count}s`;
        if (count <= 0) {
          clearInterval(timer);
          resendBtn.disabled = false;
          resendBtn.innerHTML = `<i class="bi bi-arrow-clockwise me-2"></i>Resend Email`;
        }
      }, 1000);
    });
  </script>
</body>
</html>
