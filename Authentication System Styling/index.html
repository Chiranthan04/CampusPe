<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AuthSystem</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />

  <!-- Google Fonts + Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Brand -->
      <div class="brand-logo">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your account to continue</p>

      <!-- Alert (hidden by default) -->
      <div id="loginAlert" class="alert alert-danger alert-custom d-none" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i>
        <span id="loginAlertMsg">Invalid email or password.</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>

        <!-- Email -->
        <div class="mb-3">
          <label for="loginEmail" class="form-label">
            <i class="bi bi-envelope me-1"></i>Email Address
          </label>
          <input
            type="email"
            id="loginEmail"
            class="form-control"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="loginPassword" class="form-label">
            <i class="bi bi-lock me-1"></i>Password
          </label>
          <div class="input-group">
            <input
              type="password"
              id="loginPassword"
              class="form-control"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              class="btn btn-outline-secondary"
              id="toggleLoginPwd"
              aria-label="Toggle password visibility"
            >
              <i class="bi bi-eye" id="toggleLoginIcon"></i>
            </button>
          </div>
          <div class="invalid-feedback">Password is required.</div>
        </div>

        <!-- Remember Me + Forgot -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" />
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>
          <a href="forgot-password.html" class="auth-link" style="font-size:.87rem;">
            Forgot password?
          </a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-primary-custom mb-3">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>

        <!-- Divider -->
        <div class="auth-divider">or</div>

        <!-- Register Link -->
        <p class="text-center mb-0" style="font-size:.9rem; color:var(--text-secondary);">
          Don't have an account?
          <a href="register.html" class="auth-link ms-1">Create one</a>
        </p>

      </form>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmFXFMrWQ8I5/s5tnFkFZQnXkKp"
    crossorigin="anonymous"
  ></script>

  <script>
    /* ---- Password Toggle ---- */
    const toggleBtn  = document.getElementById('toggleLoginPwd');
    const pwdInput   = document.getElementById('loginPassword');
    const toggleIcon = document.getElementById('toggleLoginIcon');

    toggleBtn.addEventListener('click', () => {
      const isHidden = pwdInput.type === 'password';
      pwdInput.type  = isHidden ? 'text' : 'password';
      toggleIcon.className = isHidden ? 'bi bi-eye-slash' : 'bi bi-eye';
    });

    /* ---- Form Validation & Submit ---- */
    const loginForm  = document.getElementById('loginForm');
    const loginAlert = document.getElementById('loginAlert');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      loginAlert.classList.add('d-none');

      if (!loginForm.checkValidity()) {
        loginForm.classList.add('was-validated');
        return;
      }

      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      /* Demo: accept any non-empty valid input → redirect to dashboard */
      if (email && password.length >= 6) {
        window.location.href = 'dashboard.html';
      } else {
        loginAlert.classList.remove('d-none');
        document.getElementById('loginAlertMsg').textContent =
          'Password must be at least 6 characters.';
      }
    });
  </script>
</body>
</html>
